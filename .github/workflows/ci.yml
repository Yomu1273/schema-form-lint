name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - name: Lint the example forms (expected to find problems)
        run: |
          set +e
          node dist/cli.js jsonforms --schema examples/jsonforms/schema.json --uischema examples/jsonforms/uischema.json
          test $? -eq 1
          node dist/cli.js rjsf --schema examples/rjsf/schema.json --ui-schema examples/rjsf/ui-schema.json
          test $? -eq 1
